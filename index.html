<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02111f" />
  <meta name="description" content="Catarina Queiroz Clínica Estética — links, agendamento e localização." />
  <title>Catarina Queiroz | Clínica Estética</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./brand-fix.css" />
</head>
<body>
  <div class="background-effects" aria-hidden="true">
    <div class="grain"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
  </div>

  <main class="bio-shell" id="bioApp" aria-live="polite">
    <section class="hero" id="heroCarousel" aria-label="Destaques da clínica">
      <div class="slides" id="slides"></div>
      <div class="hero-shade"></div>
      <div class="brand-lockup" aria-label="Catarina Queiroz Clínica Estética">
        <img src="./assets/catarina-mark.svg" alt="" class="brand-mark" />
        <div class="brand-copy">
          <strong id="brandLine1">CATARINA</strong>
          <strong id="brandLine2">QUEIROZ</strong>
          <span id="brandSubtitle">CLÍNICA ESTÉTICA</span>
        </div>
      </div>
      <div class="slide-indicators" id="slideIndicators" aria-label="Selecionar destaque"></div>
    </section>

    <section class="content-stack">
      <a class="featured-link" id="featuredLink" target="_blank" rel="noopener noreferrer">
        <span class="featured-inner">
          <span class="featured-icon" id="featuredIcon" aria-hidden="true"></span>
          <span class="featured-copy">
            <strong id="featuredTitle"></strong>
            <small id="featuredSubtitle"></small>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>

      <section class="links-section" aria-labelledby="linksHeading">
        <p class="section-label" id="linksHeading">ACESSOS</p>
        <div class="links-list" id="linksList"></div>
      </section>

      <section class="bio-card" id="bioCard">
        <p class="bio-quote" id="bioQuote"></p>
        <p class="bio-location" id="bioLocation"></p>
      </section>

      <section class="services-strip" id="servicesSection" aria-labelledby="servicesHeading">
        <p class="section-label" id="servicesHeading">CUIDADOS EM DESTAQUE</p>
        <div class="services-list" id="servicesList"></div>
      </section>
    </section>

    <footer class="footer">
      <p id="copyright"></p>
      <p class="footer-note" id="footerNote"></p>
    </footer>
  </main>

  <script src="./content.js"></script>
  <script src="./app.js"></script>
</body>
</html>
